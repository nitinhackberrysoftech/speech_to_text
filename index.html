<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Voice Chatbot Fixed</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.chat-container{
  height:70vh;
  overflow:auto;
  padding:20px;
}

.message{
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

.user-msg{background:#7c3aed;margin-left:auto;}
.bot-msg{background:#1e293b;}

.input-area{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  gap:10px;
  padding:10px;
  background:#111827;
}

#userInput{
  flex:1;
  height:45px;
  border-radius:20px;
  padding:0 15px;
}
</style>
</head>

<body>

<div class="chat-container" id="chatContainer">
  <h2>Voice Chatbot (Fixed)</h2>
</div>

<div class="input-area">
  <input id="userInput" placeholder="Speak or type..." />
  <button id="startBtn">🎤</button>
  <button id="stopBtn">⏹</button>
  <button id="downloadBtn">⬇</button>
  <button id="sendBtn">Send</button>
</div>

<script>

const chatContainer = document.getElementById("chatContainer");
const userInput = document.getElementById("userInput");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const downloadBtn = document.getElementById("downloadBtn");
const sendBtn = document.getElementById("sendBtn");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;

let liveTextFile = "";
let lastSavedText = "";

/* ---------------- SPEECH ---------------- */

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "gu-IN";

  recognition.onresult = (event) => {

    let finalText = "";

    // 🔥 ONLY FINAL RESULTS (no duplicates)
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalText += event.results[i][0].transcript + " ";
      }
    }

    finalText = finalText.trim();

    if (finalText) {

      userInput.value = finalText;

      addUser(finalText);

      updateLiveFile(finalText);
    }
  };
}

/* ---------------- START / STOP ---------------- */

startBtn.onclick = () => {
  recognition.start();
};

stopBtn.onclick = () => {
  recognition.stop();
};

/* ---------------- CHAT ---------------- */

sendBtn.onclick = () => {

  const msg = userInput.value.trim();
  if (!msg) return;

  addUser(msg);
  updateLiveFile(msg);

  userInput.value = "";

  setTimeout(() => {
    addBot("You said: " + msg);
  }, 500);
};

function addUser(msg){
  const div = document.createElement("div");
  div.className = "user-msg message";
  div.innerText = msg;
  chatContainer.appendChild(div);
}

function addBot(msg){
  const div = document.createElement("div");
  div.className = "bot-msg message";
  div.innerText = msg;
  chatContainer.appendChild(div);
}

/* ---------------- 🔥 FIXED LIVE FILE ---------------- */

function updateLiveFile(text){

  text = text.trim();
  if (!text) return;

  // ❌ prevent duplicate save
  if (text === lastSavedText) return;

  liveTextFile += text + "\n";
  lastSavedText = text;
}

/* ---------------- DOWNLOAD ---------------- */

downloadBtn.onclick = () => {

  const blob = new Blob([liveTextFile], {
    type: "text/plain"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "voice-transcript.txt";
  a.click();
};

</script>

</body>
</html>
