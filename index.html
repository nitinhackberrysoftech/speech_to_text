<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Voice Chatbot Fixed</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.chat-container{
  height:70vh;
  overflow:auto;
  padding:20px;
}

.message{
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

.user-msg{background:#7c3aed;margin-left:auto;}
.bot-msg{background:#1e293b;}

.input-area{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  gap:10px;
  padding:10px;
  background:#111827;
}

#userInput{
    flex:1;
    padding:10px;
    border-radius:20px;
    border:none;
    margin-bottom:30px;
}

#startBtn{
    background:#22c55e;
    border:none;
    color:white;
    padding:0 20px;
    border-radius:20px;
    cursor:pointer;
    margin-bottom:30px;
}

#stopBtn{
    background:#ef4444;
    border:none;
    color:white;
    padding:0 20px;
    border-radius:20px;
    cursor:pointer;
    margin-bottom:30px;
}

#downloadBtn{
    background:#7c3aed;
    border:none;
    color:white;
    padding:0 20px;
    border-radius:20px;
    cursor:pointer;
    margin-bottom:30px;
}

#sendBtn{
    margin-right:30px;
    background:#7c3aed;
    border:none;
    color:white;
    padding:0 20px;
    border-radius:20px;
    cursor:pointer;
    margin-bottom:30px;
}
</style>
</head>

<body>

<div class="chat-container" id="chatContainer">
  <h2>Voice Chatbot (Fixed)</h2>
</div>

<a href="home.html" style="color:#3b82f6;margin-left:20px;">← Back to Home</a>

<div class="input-area">
  <input id="userInput" placeholder="Speak or type..." />
  <button id="startBtn">🎤 Start</button>
  <button id="stopBtn">⏹ Stop</button>
  <button id="downloadBtn">⬇</button>
  <button id="sendBtn">Send</button>
</div>

<script>

const chatContainer = document.getElementById("chatContainer");
const userInput = document.getElementById("userInput");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const downloadBtn = document.getElementById("downloadBtn");
const sendBtn = document.getElementById("sendBtn");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let isListening = false;

let liveTextFile = "";
let lastSavedText = "";

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = "gu-IN";

  recognition.onresult = (event) => {

    let finalText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalText += event.results[i][0].transcript + " ";
      }
    }

    finalText = finalText.trim();

    if (finalText) {
      userInput.value = finalText;
      addUser(finalText);
      updateLiveFile(finalText);
    }
  };

  // 🔥 IMPORTANT FIX: auto restart mic if not stopped manually
  recognition.onend = () => {
    if (isListening) {
      recognition.start();
    }
  };

}

/* ---------------- START ---------------- */

startBtn.onclick = () => {
  if (!recognition) return;

  isListening = true;
  recognition.start();
};

/* ---------------- STOP ---------------- */

stopBtn.onclick = () => {
  isListening = false;
  recognition.stop();
};

/* ---------------- CHAT ---------------- */

sendBtn.onclick = () => {

  const msg = userInput.value.trim();
  if (!msg) return;

  addUser(msg);
  updateLiveFile(msg);

  userInput.value = "";

  setTimeout(() => {
    addBot("You said: " + msg);
  }, 500);
};

function addUser(msg){
  const div = document.createElement("div");
  div.className = "user-msg message";
  div.innerText = msg;
  chatContainer.appendChild(div);
}

function addBot(msg){
  const div = document.createElement("div");
  div.className = "bot-msg message";
  div.innerText = msg;
  chatContainer.appendChild(div);
}

/* ---------------- FILE ---------------- */

function updateLiveFile(text){

  text = text.trim();
  if (!text) return;

  if (text === lastSavedText) return;

  liveTextFile += text + "\n";
  lastSavedText = text;
}

/* ---------------- DOWNLOAD ---------------- */

downloadBtn.onclick = () => {

  const blob = new Blob([liveTextFile], {
    type: "text/plain"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "voice-transcript.txt";
  a.click();
};

</script>

</body>
</html>
